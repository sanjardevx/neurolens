[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolens-api"
version = "0.1.0"
description = "NeuroLens API: doctor login, cases, scans, AI results, review and audit log"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pyjwt[crypto]",
    "httpx",  # LLM client
    "pydantic-settings",
    "python-multipart",
    "numpy",
    "nibabel",
    "pydicom>=3",
    "pillow",
    "opencv-python-headless",
    "onnxruntime",
    # + the torch-free inference code from ml/: pip install --no-deps -e ml
]

[project.optional-dependencies]
dev = ["pytest", "onnx"]  # onnx: builds the stand-in models in tests

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
