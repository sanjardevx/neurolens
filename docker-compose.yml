# Local run: docker compose up --build   (API on http://localhost:8000, docs at /docs)
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env            # SUPABASE_URL, DATABASE_URL (Supabase Postgres) ...; never baked into the image
    environment:
      MODEL_DIR: /models
      STORAGE_DIR: /data/storage
    volumes:
      - ./ml/models:/models:ro  # classifier.onnx, segmenter3d.onnx (not in git)
      - api-data:/data
volumes:
  api-data:
