name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.5"
          args: check ml backend

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      # CPU-only torch + a matching torchvision (timm needs it): tiny models on fake data, no GPU needed
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e "ml[export,dev,seg]"
      - run: pytest ml -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The API serves ONNX only; from ml/ it needs just the torch-free inference code
      - run: pip install -e "backend[dev]" && pip install --no-deps -e ml
      - run: pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next build also type-checks, with the route types it generates (a bare tsc can't see them)
      - run: npm run build
