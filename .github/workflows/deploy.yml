name: Deploy

# The API goes to Azure Container Apps only after CI passed on master. The dashboard deploys through
# Vercel's own Git integration (production branch: master), so it needs no job here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  api:
    if: github.event.workflow_run.conclusion == 'success' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production  # Azure trusts GitHub logins from this environment only
    permissions:
      contents: read
      packages: write  # push the image to GitHub Container Registry
      id-token: write  # keyless login to Azure: no password stored in GitHub
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/neurolens-api:${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  # exactly the commit CI checked
      # The image downloads the two ONNX files from the public model repo at build time
      - name: Build and push the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -f backend/Dockerfile --build-arg MODEL_REPO=${{ vars.MODEL_REPO }} -t "$IMAGE" .
          docker push "$IMAGE"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Size, scaling, settings and secrets live on the container app (set once, see backend/README.md);
      # a deploy only swaps the image
      - name: Deploy
        run: az containerapp update --name neurolens-api --resource-group neurolens --image "$IMAGE" --output none
